# main 的同一次构建同时发布到两个入口；Cloudflare 额外带上 API Worker。
name: Deploy H5 to GitHub and Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

concurrency:
  group: pages
  # 一次发布的两个入口完成后再处理下一次推送，避免中途取消造成版本分叉。
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build:h5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: h5/dist
      - name: Build Cloudflare API Worker
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.152.0 pages functions build --directory h5/dist/functions --outdir "$RUNNER_TEMP/sandayi-worker"
          cp "$RUNNER_TEMP/sandayi-worker/index.js" h5/dist/_worker.js
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages
          path: h5/dist
          include-hidden-files: true # 保留 .assetsignore，源码目录不作为静态资产上传
          retention-days: 7

  deploy:
    # 备用入口发布成功后才更新主入口，Cloudflare 授权失败时保留现有版本。
    needs: [build, deploy-cloudflare]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages
          path: h5/dist
      - name: Deploy to sandayi.pages.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable in repository Actions settings.'
            exit 1
          fi
          npx --yes wrangler@4.152.0 pages deploy h5/dist --project-name sandayi --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false

  verify:
    needs: [deploy, deploy-cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages
          path: h5/dist
      - name: Verify both production entrances and Cloudflare API
        run: node tools/verify-h5-deploy.js
